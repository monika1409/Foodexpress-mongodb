<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Menu Admin — FOOD EXPRESS</title>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --orange: #FF6B2C;
    --orange-light: #FFF0E8;
    --orange-dark: #D94F10;
    --green: #22C55E;
    --green-light: #DCFCE7;
    --red: #EF4444;
    --red-light: #FEE2E2;
    --bg: #FFF8F4;
    --card: #FFFFFF;
    --text: #1A1A1A;
    --muted: #6B7280;
    --border: #E5E7EB;
    --radius: 14px;
    --shadow: 0 2px 16px rgba(255,107,44,0.10);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Outfit', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; }

  .topbar {
    background: #fff; border-bottom: 1px solid var(--border);
    padding: 0 1.5rem; position: sticky; top: 0; z-index: 10;
  }
  .topbar-inner {
    max-width: 1200px; margin: 0 auto; height: 64px;
    display: flex; align-items: center; justify-content: space-between;
  }
  .logo { font-size: 1.3rem; font-weight: 700; color: var(--orange); }
  .logo span { color: var(--text); font-weight: 400; font-size: 1rem; margin-left: 8px; }
  .topbar a { color: var(--muted); text-decoration: none; font-size: 14px; font-weight: 500; }
  .topbar a:hover { color: var(--orange); }

  .wrap { max-width: 1200px; margin: 0 auto; padding: 2rem 1.5rem 4rem; }

  .page-head { display: flex; align-items: flex-end; justify-content: space-between; margin-bottom: 1.5rem; flex-wrap: wrap; gap: 12px; }
  .page-head h1 { font-size: 1.6rem; font-weight: 700; }
  .page-head p { color: var(--muted); font-size: 14px; margin-top: 4px; }

  .btn {
    border: none; border-radius: 10px; font-family: 'Outfit', sans-serif; font-weight: 600;
    cursor: pointer; transition: all .15s; font-size: 14px;
  }
  .btn-primary { background: var(--orange); color: #fff; padding: 11px 20px; }
  .btn-primary:hover { background: var(--orange-dark); }
  .btn-ghost { background: transparent; color: var(--muted); padding: 11px 16px; border: 1.5px solid var(--border); }
  .btn-ghost:hover { border-color: var(--orange); color: var(--orange); }
  .btn-sm { padding: 6px 12px; font-size: 13px; border-radius: 8px; }
  .btn-danger { background: var(--red-light); color: var(--red); }
  .btn-danger:hover { background: var(--red); color: #fff; }
  .btn-edit { background: var(--orange-light); color: var(--orange-dark); }
  .btn-edit:hover { background: var(--orange); color: #fff; }

  .toolbar {
    display: flex; gap: 12px; margin-bottom: 1.2rem; flex-wrap: wrap; align-items: center;
  }
  .search-box {
    flex: 1; min-width: 200px; max-width: 360px;
    border: 1.5px solid var(--border); border-radius: 10px; padding: 10px 14px;
    font-family: 'Outfit', sans-serif; font-size: 14px; background: #fff; outline: none;
  }
  .search-box:focus { border-color: var(--orange); }
  .cat-filter {
    border: 1.5px solid var(--border); border-radius: 10px; padding: 10px 14px;
    font-family: 'Outfit', sans-serif; font-size: 14px; background: #fff; outline: none; color: var(--text);
  }

  .table-card { background: var(--card); border-radius: var(--radius); box-shadow: var(--shadow); overflow: hidden; }
  table { width: 100%; border-collapse: collapse; }
  thead th {
    text-align: left; font-size: 12px; text-transform: uppercase; letter-spacing: .04em;
    color: var(--muted); padding: 14px 16px; border-bottom: 1.5px solid var(--border); white-space: nowrap;
  }
  tbody td { padding: 12px 16px; border-bottom: 1px solid var(--border); font-size: 14px; vertical-align: middle; }
  tbody tr:last-child td { border-bottom: none; }
  tbody tr:hover { background: var(--orange-light); }
  .thumb { width: 44px; height: 44px; border-radius: 8px; object-fit: cover; background: #eee; flex-shrink: 0; }
  .name-cell { display: flex; align-items: center; gap: 10px; }
  .name-cell .nm { font-weight: 600; }
  .name-cell .ds { color: var(--muted); font-size: 12px; max-width: 260px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .pill { display: inline-block; padding: 3px 10px; border-radius: 20px; font-size: 12px; font-weight: 600; }
  .pill-veg { background: var(--green-light); color: #15803D; }
  .pill-nonveg { background: var(--red-light); color: #B91C1C; }
  .pill-cat { background: var(--orange-light); color: var(--orange-dark); }
  .row-actions { display: flex; gap: 8px; }
  .empty-state { text-align: center; padding: 3rem 1rem; color: var(--muted); }

  /* MODAL */
  .modal-backdrop {
    display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.45);
    align-items: center; justify-content: center; z-index: 100; padding: 1rem;
  }
  .modal-backdrop.active { display: flex; }
  .modal {
    background: #fff; border-radius: var(--radius); padding: 1.8rem; width: 100%; max-width: 520px;
    max-height: 90vh; overflow-y: auto;
  }
  .modal h2 { font-size: 1.25rem; font-weight: 700; margin-bottom: 1.2rem; }
  .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
  .form-grid .full { grid-column: 1 / -1; }
  .field label { display: block; font-size: 13px; font-weight: 500; color: var(--muted); margin-bottom: 5px; }
  .field input, .field select, .field textarea {
    width: 100%; padding: 10px 12px; border: 1.5px solid var(--border); border-radius: 10px;
    font-family: 'Outfit', sans-serif; font-size: 14px; outline: none; background: #FAFAFA;
  }
  .field input:focus, .field select:focus, .field textarea:focus { border-color: var(--orange); background: #fff; }
  .field textarea { resize: vertical; min-height: 56px; }
  .checkbox-row { display: flex; gap: 18px; align-items: center; margin-top: 4px; }
  .checkbox-field { display: flex; align-items: center; gap: 7px; }
  .checkbox-field input { width: auto; }
  .checkbox-field label { margin: 0; color: var(--text); font-size: 14px; }
  .modal-actions { display: flex; justify-content: flex-end; gap: 10px; margin-top: 1.4rem; }
  .form-error { background: var(--red-light); color: #B91C1C; padding: 9px 12px; border-radius: 8px; font-size: 13px; margin-bottom: 12px; display: none; }
  .image-preview-wrap { display: flex; gap: 10px; align-items: flex-start; }
  .image-preview { width: 64px; height: 64px; border-radius: 8px; object-fit: cover; background: #eee; flex-shrink: 0; }
  .field-hint { font-size: 12px; color: var(--muted); margin-top: 4px; }

  .toast {
    position: fixed; bottom: 24px; right: 24px; background: var(--text); color: #fff;
    padding: 12px 20px; border-radius: 10px; font-size: 14px; font-weight: 500;
    box-shadow: 0 8px 30px rgba(0,0,0,0.25); transform: translateY(100px); opacity: 0;
    transition: all .25s; z-index: 200;
  }
  .toast.show { transform: translateY(0); opacity: 1; }

  @media (max-width: 640px) {
    .form-grid { grid-template-columns: 1fr; }
    thead th:nth-child(4), tbody td:nth-child(4) { display: none; } /* hide rating col on small screens */
  }
</style>
</head>
<body>

<!-- LOGIN SCREEN -->
<div id="login-screen" style="min-height:100vh; display:flex; align-items:center; justify-content:center; padding:1.5rem;">
  <div style="background:#fff; border-radius:var(--radius); box-shadow:var(--shadow); padding:2.2rem; width:100%; max-width:380px;">
    <div style="text-align:center; margin-bottom:1.4rem;">
      <div style="font-size:2rem; margin-bottom:6px;">🍱</div>
      <div style="font-size:1.2rem; font-weight:700;">FOOD EXPRESS Admin</div>
      <div style="color:var(--muted); font-size:13px; margin-top:4px;">Enter the admin password to manage the menu</div>
    </div>
    <form id="login-form" onsubmit="handleLogin(event)">
      <div class="field" style="margin-bottom:14px;">
        <label>Password</label>
        <input type="password" id="login-password" required autofocus placeholder="••••••••">
      </div>
      <div class="form-error" id="login-error">Incorrect password. Try again.</div>
      <button type="submit" class="btn btn-primary" style="width:100%; padding:11px;">Log in</button>
    </form>
  </div>
</div>

<!-- ADMIN DASHBOARD (hidden until logged in) -->
<div id="dashboard" style="display:none;">

<div class="topbar">
  <div class="topbar-inner">
    <div class="logo">🍱 FOOD EXPRESS <span>Menu Admin</span></div>
    <div style="display:flex; align-items:center; gap:16px;">
      <a href="index-1.html">← Back to site</a>
      <button class="btn btn-ghost btn-sm" onclick="handleLogout()">Log out</button>
    </div>
  </div>
</div>

<div class="wrap">
  <div class="page-head">
    <div>
      <h1>Manage menu</h1>
      <p id="item-count">Loading…</p>
    </div>
    <button class="btn btn-primary" onclick="openAddModal()">+ Add dish</button>
  </div>

  <div class="toolbar">
    <input type="text" class="search-box" id="search" placeholder="Search dishes…" oninput="renderTable()">
    <select class="cat-filter" id="cat-filter" onchange="renderTable()">
      <option value="All">All categories</option>
    </select>
  </div>

  <div class="table-card">
    <table>
      <thead>
        <tr>
          <th>Dish</th>
          <th>Category</th>
          <th>Price</th>
          <th>Rating</th>
          <th>Tags</th>
          <th></th>
        </tr>
      </thead>
      <tbody id="table-body">
        <tr><td colspan="6" class="empty-state">Loading menu…</td></tr>
      </tbody>
    </table>
  </div>
</div>

<!-- ADD/EDIT MODAL -->
<div class="modal-backdrop" id="modal-backdrop">
  <div class="modal">
    <h2 id="modal-title">Add dish</h2>
    <div class="form-error" id="form-error"></div>
    <form id="dish-form" onsubmit="submitForm(event)">
      <input type="hidden" id="f-id">
      <div class="form-grid">
        <div class="field full">
          <label>Dish name *</label>
          <input type="text" id="f-name" required maxlength="80">
        </div>
        <div class="field">
          <label>Category *</label>
          <input type="text" id="f-cat" required list="cat-suggestions" placeholder="e.g. Starters">
          <datalist id="cat-suggestions"></datalist>
        </div>
        <div class="field">
          <label>Price (₹) *</label>
          <input type="number" id="f-price" required min="0" step="1">
        </div>
        <div class="field full">
          <label>Description</label>
          <textarea id="f-desc" maxlength="200"></textarea>
        </div>
        <div class="field full">
          <label>Image</label>
          <div class="image-preview-wrap">
            <img id="f-image-preview" class="image-preview" src="" alt="" style="display:none">
            <div style="flex:1">
              <input type="file" id="f-image-file" accept="image/*" onchange="previewImage(event)">
              <div class="field-hint">Upload a photo, or leave blank to keep the current one.</div>
            </div>
          </div>
        </div>
        <div class="field full">
          <div class="checkbox-row">
            <div class="checkbox-field"><input type="checkbox" id="f-veg"><label for="f-veg">🌱 Veg</label></div>
            <div class="checkbox-field"><input type="checkbox" id="f-spicy"><label for="f-spicy">🌶 Spicy</label></div>
            <div class="checkbox-field"><input type="checkbox" id="f-best"><label for="f-best">⭐ Bestseller</label></div>
          </div>
        </div>
      </div>
      <div class="modal-actions">
        <button type="button" class="btn btn-ghost" onclick="closeModal()">Cancel</button>
        <button type="submit" class="btn btn-primary" id="submit-btn">Save dish</button>
      </div>
    </form>
  </div>
</div>

<div class="toast" id="toast"></div>

</div><!-- /#dashboard -->

<script>
const API = '/api/menu';
let MENU = [];
let editingFile = null;
let adminToken = null;

async function loadMenu() {
  const res = await fetch(API);
  if (!res.ok) throw new Error('Failed to load menu');
  MENU = await res.json();
  populateCategoryFilter();
  renderTable();
}

function populateCategoryFilter() {
  const cats = [...new Set(MENU.map(m => m.cat))].sort();
  const sel = document.getElementById('cat-filter');
  const current = sel.value;
  sel.innerHTML = '<option value="All">All categories</option>' +
    cats.map(c => `<option value="${c}">${c}</option>`).join('');
  sel.value = current || 'All';

  const datalist = document.getElementById('cat-suggestions');
  datalist.innerHTML = cats.map(c => `<option value="${c}">`).join('');
}

function renderTable() {
  const q = document.getElementById('search').value.toLowerCase();
  const cat = document.getElementById('cat-filter').value;
  let items = MENU.filter(m => {
    if (cat !== 'All' && m.cat !== cat) return false;
    if (q && !m.name.toLowerCase().includes(q) && !(m.desc || '').toLowerCase().includes(q)) return false;
    return true;
  });

  document.getElementById('item-count').textContent = `${MENU.length} dish${MENU.length === 1 ? '' : 'es'} total`;

  const body = document.getElementById('table-body');
  if (items.length === 0) {
    body.innerHTML = `<tr><td colspan="6" class="empty-state">No dishes match your search.</td></tr>`;
    return;
  }

  body.innerHTML = items.map(m => `
    <tr>
      <td>
        <div class="name-cell">
          <img class="thumb" src="${m.image || ''}" alt="" onerror="this.style.visibility='hidden'">
          <div>
            <div class="nm">${escapeHtml(m.name)}</div>
            <div class="ds">${escapeHtml(m.desc || '')}</div>
          </div>
        </div>
      </td>
      <td><span class="pill pill-cat">${escapeHtml(m.cat)}</span></td>
      <td>₹${m.price}</td>
      <td>${m.rating?.toFixed ? m.rating.toFixed(1) : m.rating} ★ <span style="color:var(--muted);font-size:12px">(${m.rcount})</span></td>
      <td>
        <span class="pill ${m.veg ? 'pill-veg' : 'pill-nonveg'}">${m.veg ? 'Veg' : 'Non-veg'}</span>
        ${m.best ? '<span class="pill pill-cat" style="margin-left:4px">⭐</span>' : ''}
      </td>
      <td>
        <div class="row-actions">
          <button class="btn btn-sm btn-edit" onclick="openEditModal(${m.id})">Edit</button>
          <button class="btn btn-sm btn-danger" onclick="deleteDish(${m.id}, '${escapeHtml(m.name).replace(/'/g, "\\'")}')">Delete</button>
        </div>
      </td>
    </tr>
  `).join('');
}

function escapeHtml(str) {
  return String(str ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

// ── Modal ──
function openAddModal() {
  editingFile = null;
  document.getElementById('modal-title').textContent = 'Add dish';
  document.getElementById('dish-form').reset();
  document.getElementById('f-id').value = '';
  document.getElementById('f-image-preview').style.display = 'none';
  document.getElementById('form-error').style.display = 'none';
  document.getElementById('submit-btn').textContent = 'Save dish';
  document.getElementById('modal-backdrop').classList.add('active');
}

function openEditModal(id) {
  const m = MENU.find(x => x.id === id);
  if (!m) return;
  editingFile = null;
  document.getElementById('modal-title').textContent = 'Edit dish';
  document.getElementById('f-id').value = m.id;
  document.getElementById('f-name').value = m.name;
  document.getElementById('f-cat').value = m.cat;
  document.getElementById('f-price').value = m.price;
  document.getElementById('f-desc').value = m.desc || '';
  document.getElementById('f-veg').checked = !!m.veg;
  document.getElementById('f-spicy').checked = !!m.spicy;
  document.getElementById('f-best').checked = !!m.best;
  document.getElementById('f-image-file').value = '';
  const preview = document.getElementById('f-image-preview');
  if (m.image) { preview.src = m.image; preview.style.display = 'block'; } else { preview.style.display = 'none'; }
  document.getElementById('form-error').style.display = 'none';
  document.getElementById('submit-btn').textContent = 'Save changes';
  document.getElementById('modal-backdrop').classList.add('active');
}

function closeModal() {
  document.getElementById('modal-backdrop').classList.remove('active');
}

function previewImage(e) {
  const file = e.target.files[0];
  if (!file) return;
  const preview = document.getElementById('f-image-preview');
  preview.src = URL.createObjectURL(file);
  preview.style.display = 'block';
}

async function submitForm(e) {
  e.preventDefault();
  const id = document.getElementById('f-id').value;
  const errorBox = document.getElementById('form-error');
  errorBox.style.display = 'none';

  const fd = new FormData();
  fd.append('name', document.getElementById('f-name').value.trim());
  fd.append('cat', document.getElementById('f-cat').value.trim());
  fd.append('price', document.getElementById('f-price').value);
  fd.append('desc', document.getElementById('f-desc').value.trim());
  fd.append('veg', document.getElementById('f-veg').checked ? 'true' : 'false');
  fd.append('spicy', document.getElementById('f-spicy').checked ? 'true' : 'false');
  fd.append('best', document.getElementById('f-best').checked ? 'true' : 'false');
  const fileInput = document.getElementById('f-image-file');
  if (fileInput.files[0]) fd.append('imageFile', fileInput.files[0]);

  const url = id ? `${API}/${id}/upload` : `${API}/upload`;
  const method = id ? 'PUT' : 'POST';

  try {
    const res = await fetch(url, {
      method,
      headers: { 'Authorization': 'Bearer ' + adminToken },
      body: fd
    });
    const data = await res.json();
    if (res.status === 401) {
      showToast('Your session expired — please log in again.');
      handleLogout();
      return;
    }
    if (!res.ok) {
      errorBox.textContent = (data.errors || [data.error] || ['Something went wrong.']).join(', ');
      errorBox.style.display = 'block';
      return;
    }
    closeModal();
    showToast(id ? `Saved changes to ${data.name}` : `Added ${data.name}`);
    await loadMenu();
  } catch (err) {
    errorBox.textContent = 'Could not reach the server. Is it running?';
    errorBox.style.display = 'block';
  }
}

async function deleteDish(id, name) {
  if (!confirm(`Delete "${name}"? This can't be undone.`)) return;
  try {
    const res = await fetch(`${API}/${id}`, {
      method: 'DELETE',
      headers: { 'Authorization': 'Bearer ' + adminToken }
    });
    if (res.status === 401) {
      showToast('Your session expired — please log in again.');
      handleLogout();
      return;
    }
    if (!res.ok) throw new Error();
    showToast(`Deleted ${name}`);
    await loadMenu();
  } catch {
    showToast('Could not delete — try again.');
  }
}

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2200);
}

document.getElementById('modal-backdrop').addEventListener('click', (e) => {
  if (e.target.id === 'modal-backdrop') closeModal();
});

// ── Login / session handling ──
async function handleLogin(e) {
  e.preventDefault();
  const password = document.getElementById('login-password').value;
  const errorBox = document.getElementById('login-error');
  errorBox.style.display = 'none';

  try {
    const res = await fetch('/api/admin/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ password })
    });
    if (!res.ok) {
      errorBox.textContent = 'Incorrect password. Try again.';
      errorBox.style.display = 'block';
      return;
    }
    const data = await res.json();
    adminToken = data.token;
    sessionStorage.setItem('adminToken', adminToken);
    showDashboard();
  } catch {
    errorBox.textContent = 'Could not reach the server. Is it running?';
    errorBox.style.display = 'block';
  }
}

function handleLogout() {
  adminToken = null;
  sessionStorage.removeItem('adminToken');
  document.getElementById('login-password').value = '';
  document.getElementById('dashboard').style.display = 'none';
  document.getElementById('login-screen').style.display = 'flex';
}

function showDashboard() {
  document.getElementById('login-screen').style.display = 'none';
  document.getElementById('dashboard').style.display = 'block';
  loadMenu().catch(() => {
    document.getElementById('table-body').innerHTML =
      `<tr><td colspan="6" class="empty-state">⚠️ Could not load menu. Is the server running?</td></tr>`;
  });
}

// If a session token already exists from earlier in this browser tab, skip the login screen
const savedToken = sessionStorage.getItem('adminToken');
if (savedToken) {
  adminToken = savedToken;
  showDashboard();
}
</script>
</body>
</html>
